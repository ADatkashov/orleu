name: docker-smoke
on:
  push:
    branches: [main]
    paths: ["backend/**", "infrastructure/**", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["backend/**", "infrastructure/**", ".github/workflows/docker.yml"]
jobs:
  compose:
    runs-on: ubuntu-latest   # needs Docker (also true for a self-hosted runner)
    env:                     # job-level: every `docker compose` call needs these (compose refuses to start without them)
      ORLEU_DB_PASSWORD: ci-only-password
      ORLEU_JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack (builds the image from backend/Dockerfile)
        working-directory: infrastructure
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 90); do
            curl -sf localhost:8080/actuator/health/readiness | grep -q '"UP"' && exit 0
            sleep 2
          done
          echo "backend never became ready"; exit 1
      - name: Smoke checks
        run: |
          curl -sf localhost:8080/actuator/health | grep '"UP"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/me)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/public/businesses/nope)" = "404"
          curl -sf -X POST localhost:8080/api/v1/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"correct-horse-battery","fullName":"CI"}' | grep accessToken
      - name: Container runs as a non-root user with a passing healthcheck
        run: |
          id=$(docker compose -f infrastructure/docker-compose.yml ps -q backend)
          test "$(docker exec "$id" id -u)" != "0"
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$id")" = "healthy" ] && exit 0
            sleep 3
          done
          docker inspect -f '{{json .State.Health}}' "$id"; exit 1
      - name: Logs on failure
        if: failure()
        working-directory: infrastructure
        run: docker compose logs --tail=100
      - name: Tear down
        if: always()
        working-directory: infrastructure
        run: docker compose down -v
