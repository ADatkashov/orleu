name: backend
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
jobs:
  test:
    runs-on: ubuntu-latest   # change to [self-hosted, linux] to use a self-hosted runner (needs Docker for Testcontainers)
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Test (Testcontainers starts postgres:16)
        run: ./gradlew --no-daemon test
      - name: Build jar
        run: ./gradlew --no-daemon bootJar -x test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: test-reports, path: backend/build/reports/tests }
