spring:
  application:
    name: orleu-backend
  datasource:
    url: ${ORLEU_DB_URL:jdbc:postgresql://localhost:5432/orleu}
    username: ${ORLEU_DB_USER:orleu}
    password: ${ORLEU_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${ORLEU_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

orleu:
  security:
    jwt-secret: ${ORLEU_JWT_SECRET:}          # required, >= 32 bytes; never commit a real value
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    max-failed-logins: 5
    lockout-duration: PT15M
    allowed-origins: ${ORLEU_ALLOWED_ORIGINS:}
    mfa-key: ${ORLEU_MFA_KEY:}               # encrypts TOTP secrets at rest; set a separate random value in production (falls back to a key derived from the JWT secret)
    require-mfa-for-platform-roles: ${ORLEU_REQUIRE_MFA_FOR_PLATFORM:false}  # set true in production: platform staff must have MFA enabled
  bootstrap-admin-email: ${ORLEU_BOOTSTRAP_ADMIN_EMAIL:}
  messaging:
    provider: ${ORLEU_MESSAGING_PROVIDER:none}   # none (default: messages stay NOT_SENT) | fake (TEST mode, delivers nothing; refused in the prod profile)
  rate-limit:
    per-minute: ${ORLEU_RATE_LIMIT_PER_MINUTE:60}
  jobs:
    expiry-interval: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health,info   # metrics are NOT exposed over HTTP: any signed-in tenant user could read them. Add a scraper-only, authenticated path first.
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    enabled: ${ORLEU_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${ORLEU_API_DOCS_ENABLED:true}
